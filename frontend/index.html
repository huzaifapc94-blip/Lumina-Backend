<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Lumina — Multi-Model AI Interface</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Mobile Sidebar Backdrop Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
                            <line x1="12" y1="22" x2="12" y2="15.5"></line>
                            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
                            <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
                            <line x1="12" y1="2" x2="12" y2="8.5"></line>
                        </svg>
                    </div>
                    <h1>Lumina</h1>
                </div>
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>New Chat</span>
                </button>
            </div>
            
            <!-- Thread History List -->
            <div class="thread-list" id="thread-list">
                <!-- Threads injected dynamically -->
            </div>

            <!-- Sidebar Footer Status -->
            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-indicator" id="status-indicator"></span>
                    <span class="status-text" id="status-text">Checking server...</span>
                </div>
            </div>
        </aside>

        <!-- Main Viewport Canvas -->
        <main class="chat-viewport">
            <!-- Header Controls -->
            <header class="viewport-header">
                <div class="sidebar-toggle" id="sidebar-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
                
                <div class="engine-control-panel">
                    <div class="select-wrapper">
                        <select id="engine-select" class="engine-select">
                            <!-- Populated dynamically from backend -->
                        </select>
                        <div class="select-arrow">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                    <div class="engine-details" id="engine-details">
                        <!-- Optimization message injected dynamically -->
                    </div>
                </div>
            </header>

            <!-- Message Stream Area -->
            <div class="chat-canvas" id="chat-canvas">
                <!-- Empty State Landing View -->
                <div class="empty-state" id="empty-state">
                    <div class="empty-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
                            <line x1="12" y1="22" x2="12" y2="15.5"></line>
                            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
                            <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
                        </svg>
                    </div>
                    <h2>How can Lumina assist you today?</h2>
                    <p class="subtitle">Select a frontier model to query and watch answers render in real-time streaming.</p>
                    
                    <div class="quick-starts">
                        <button class="quick-start-card" data-prompt="Draft a highly optimized Python quicksort routine.">
                            <h3>Code Engineering</h3>
                            <p>"Draft a highly optimized Python quicksort routine."</p>
                        </button>
                        <button class="quick-start-card" data-prompt="Analyze the differences between Server-Sent Events and WebSockets.">
                            <h3>Technical Research</h3>
                            <p>"Analyze differences between SSE and WebSockets."</p>
                        </button>
                        <button class="quick-start-card" data-prompt="Compose a technical pitch for a serverless proxy caching gateway.">
                            <h3>Document Synthesis</h3>
                            <p>"Compose a pitch for a serverless proxy caching gateway."</p>
                        </button>
                    </div>
                </div>

                <!-- Chat history bubbles injected dynamically -->
            </div>

            <!-- Input Controls Footer -->
            <footer class="viewport-footer">
                <!-- Stop Stream Trigger Panel -->
                <div class="stop-stream-panel" id="stop-stream-panel">
                    <button class="stop-stream-btn" id="stop-stream-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect></svg>
                        <span>Stop Generating</span>
                    </button>
                </div>

                <!-- Main Input Textarea Container -->
                <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple style="display:none">
                <div class="attachment-preview" id="attachment-preview"></div>
                <div class="input-container">
                    <button type="button" class="attach-btn" id="attach-btn" title="Attach image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <textarea 
                        id="chat-input" 
                        placeholder="Message Lumina..." 
                        rows="1" 
                        autocomplete="off"
                        autofocus
                    ></textarea>
                    
                    <button class="send-btn" id="send-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="footer-note">
                    All completions are securely routed through Lumina’s Agent Router proxy.
                </div>
            </footer>
        </main>
    </div>

    <!-- Script imports -->
    <script src="markdown.js"></script>
    <script src="app.js"></script>
</body>
</html>
